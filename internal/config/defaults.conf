# Segments to render, in order, separated by spaces.
segments = path model ctx tokens cache boot skills skills_stripped agent_skills mem rate5h rate7d

# Glyph drawn between segments.
separator = ·

# Colour theme: a built-in name (classic or gradient) or the path to a theme file; a path contains / or starts with ~.
theme = classic

# Seconds a custom segment hook's result is reused before the hook runs again; a hook can override it with a "# statusline-ttl: <seconds>" line in its first 20 lines.
hooks.ttl = 60
# Seconds a hook may run before it is killed; the last result is kept.
hooks.timeout = 2

# Save the latest session payload for other tools to read (true or false).
snapshot.enabled = true
# Where to save it; empty means usage-latest.json in your Claude config directory.
snapshot.path =
