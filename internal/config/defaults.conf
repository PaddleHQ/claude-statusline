# Segments to render, in order, separated by spaces.
segments = path model ctx tokens cache boot skills skills_stripped agent_skills mem rate5h rate7d

# Glyph drawn between segments.
separator = ·

# Colour theme: a built-in name (classic or gradient) or the path to a theme file; a path contains / or starts with ~.
theme = classic

# Directory prefixes to strip from the path, separated by spaces; a leading ~ means your home directory.
path.strip =
# Show the git branch after the path (true or false).
path.branch = true

# Show the effort level after the model name (true or false).
model.effort = true

# Context bar width in cells on a wide terminal (160 columns or more).
ctx.width = 10
# Context bar width below 160 columns.
ctx.width_medium = 8
# Context bar width below 120 columns.
ctx.width_narrow = 6
# Context usage percentage at or above which the fill turns amber.
ctx.warn = 50
# Context usage percentage at or above which the fill turns red.
ctx.bad = 90

# Prompt cache hit percentage below which the cache figure turns red.
cache.warn = 5

# Text shown before the 5 hour bar.
rate5h.label = 5h
# Bar width in cells on a wide terminal (160 columns or more).
rate5h.width = 20
# Bar width below 160 columns.
rate5h.width_medium = 14
# Bar width below 120 columns.
rate5h.width_narrow = 10
# Pace deviation, in percentage points, beyond which the fill turns amber.
rate5h.warn = 20
# Pace deviation, in percentage points, beyond which the fill turns red.
rate5h.bad = 40
# Usage percentage at or above which the fill is always red.
rate5h.hard_cap = 95

# Text shown before the 7 day bar.
rate7d.label = 7d
# Bar width in cells on a wide terminal (160 columns or more).
rate7d.width = 20
# Bar width below 160 columns.
rate7d.width_medium = 14
# Bar width below 120 columns.
rate7d.width_narrow = 10
# Pace deviation, in percentage points, beyond which the fill turns amber.
rate7d.warn = 10
# Pace deviation, in percentage points, beyond which the fill turns red.
rate7d.bad = 20
# Usage percentage at or above which the fill is always red.
rate7d.hard_cap = 95

# Seconds a custom segment hook's result is reused before the hook runs again; a hook can override it with a "# statusline-ttl: <seconds>" line in its first 20 lines.
hooks.ttl = 60
# Seconds a hook may run before it is killed; the last result is kept.
hooks.timeout = 2

# Save the latest session payload for other tools to read (true or false).
snapshot.enabled = true
# Where to save it; empty means usage-latest.json in your Claude config directory.
snapshot.path =
