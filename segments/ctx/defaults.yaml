ctx:
  # Context bar width in cells on a wide terminal (160 columns or more).
  width: 10
  # Context bar width below 160 columns.
  width_medium: 8
  # Context bar width below 120 columns.
  width_narrow: 6
  # Context usage percentage at or above which the fill turns amber.
  warn: 50
  # Context usage percentage at or above which the fill turns red.
  bad: 90
  # Context tokens at which the bar shows a compact marker and warning; 0 turns this limit off.
  compact_at: 200000
  # Percentage of the context window at which the bar shows a compact marker and warning; 0 turns this limit off.
  compact_pct: 80
