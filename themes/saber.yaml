# saber: a lightsaber blade. The blade takes one color for the pace state and
# brightens towards white over its last few cells. The pace color also colors
# the percentage after it.
# A complete theme file: same fields as classic.yaml, plus the saber ones.

# Color roles, as in classic.yaml. The state colors are a Jedi blue, a Windu
# purple and a Sith red.
colors:
  text: ""
  muted: dim
  good: "#4aa8ff"
  warn: "#b26bff"
  bad: "#ff3b30"
  marker: bold
  path: bold 33
  # Optional. The branch in the path segment; defaults to the path color.
  branch: bold 33
  # Optional. The branch of a linked worktree; defaults to bold 208.
  worktree: bold 208

bar:
  style: saber
  full: "━"
  # Half-lit final cell, drawn when the usage ends mid-cell.
  tip: "╸"
  empty: "─"
  marker: "┃"
  # Blade colors for good, warn and bad, as #rrggbb.
  blade: ["#4aa8ff", "#b26bff", "#ff3b30"]
  # How far, in percent, the tip cell is blended towards white (0 to 100).
  glow: 50
  # How many of the last lit cells glow, ramping up to the tip (at least 1).
  glow_cells: 3
  # Unfilled cells and the pace marker.
  empty_color: "#3a3a3a"
  marker_color: bold
  # Optional, and valid in any style. Draws each label as a hilt: a pommel, then
  # a grip in this #rrggbb color holding the label in hilt_text_color.
  hilt_color: "#4b5160"
  hilt_text_color: "#d8dee9"
  # The pommel glyphs. The right eighth block puts a thin line against the grip.
  hilt_pommel: "▕"
  # The pommel color: "fill" follows the bar's state color, or give a #rrggbb.
  # Defaults to the hilt color.
  hilt_pommel_color: fill
  # Cooling fins after the grip (0 to 8, default 0), each one column wide glyph
  # (default "║") on the hilt color. The color is required when there are fins:
  # "fill" follows the bar's state color, or give a fixed #rrggbb.
  hilt_fins: 3
  hilt_fin: "║"
  hilt_fin_color: fill

# Optional. Emoji shown before a branch and a worktree in the path segment.
glyphs:
  branch: "🌿"
  worktree: "🌳"
