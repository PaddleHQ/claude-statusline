name: Weekly fuzz

on:
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Time to fuzz each target (for example 3m or 30m)'
        default: '3m'
        required: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }} (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: ./internal/payload, target: FuzzParse}
          - {package: ./internal/config, target: FuzzLoad}
          - {package: ./internal/config, target: FuzzParseNumber}
          - {package: ./internal/theme, target: FuzzParseColor}
          - {package: ./internal/theme, target: FuzzOpen}
          - {package: ./internal/hook, target: FuzzSanitize}
          - {package: ./internal/hook, target: FuzzHeader}
          - {package: ./internal/transcript, target: FuzzRead}
          - {package: ./internal/ratecache, target: FuzzLoad}
          - {package: ./internal/layout, target: FuzzWidth}
          - {package: ./segments/tokens, target: FuzzFormatTokens}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '3m' }}
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime="${FUZZTIME}" "${PACKAGE}"

      - name: Collect new crashing inputs
        if: failure()
        run: |
          mkdir -p crashers
          git ls-files --others --exclude-standard -- '*/testdata/fuzz/*' | while read -r file; do
            cp --parents "$file" crashers/
          done
          find crashers -type f

      - name: Upload new crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crashers-${{ matrix.target }}-${{ strategy.job-index }}
          path: crashers
          if-no-files-found: ignore
          retention-days: 30
